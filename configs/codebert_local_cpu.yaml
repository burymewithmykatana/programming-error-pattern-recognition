random_seed: 42
model:
  name: microsoft/codebert-base
  max_length: 128
  num_labels: 8
training:
  epochs: 1
  batch_size: 2
  learning_rate: 0.00002
  gradient_accumulation_steps: 8
  validation_size: 0.1
  early_stopping_patience: 1
  mixed_precision: false
notes: "CPU-safe local CodeBERT config. Use for synthetic full and reduced CodeContests runs."
